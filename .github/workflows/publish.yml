name: Publish to npm

on:
    release:
        types: [created]
    workflow_dispatch:
        inputs:
            version:
                required: true
                type: string

permissions:
    id-token: write
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - run: bun install --frozen-lockfile
            - run: bun run build

            - name: Upload Build Artifact
              uses: actions/upload-artifact@v7.0.1
              with:
                  name: dist-files
                  path: dist/

    publish-npm:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Download Build Artifact
              uses: actions/download-artifact@v8.0.1
              with:
                  name: dist-files
                  path: dist/

            - name: Increment Version
              run: bun pm version ${{github.event.inputs.version || inputs.version}} --no-git-tag-version -f

            - run: npm publish
